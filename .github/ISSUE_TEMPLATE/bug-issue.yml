name: Bug report / 问题反馈
description: Report an issue in this unofficial editor.
body:
  - type: markdown
    attributes:
      value: Please report UTAU Editor problems here. Remove private paths, tokens and unpublished content before attaching files. 中文或 English 均可。
  - type: input
    attributes:
      label: Version and platform / 版本与平台
      placeholder: "0.1.0, Windows 11 x64"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps, expected result and actual result / 复现与预期
    validations:
      required: true
  - type: textarea
    attributes:
      label: Optional evidence / 可选附件
      description: A minimal map, screenshot or relevant log excerpt helps. Do not attach your entire data folder.
