name: Editor checks
on:
  push:
    branches: ['UTAU_Editor', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build osu.Desktop/osu.Desktop.csproj -c Release -p:RunAnalyzers=false
      - name: Core regressions
        run: dotnet test osu.Game.Tests/osu.Game.Tests.csproj -p:RunAnalyzers=false --filter 'FullyQualifiedName~EditorPreviewSessionTest|FullyQualifiedName~BeatTimelineTest|FullyQualifiedName~HitsoundTimeMatcherTest|FullyQualifiedName~EditorToolboxOrderTest|FullyQualifiedName~GlobalOffsetAdjustmentTest' --logger 'trx;LogFileName=core.trx'
      - name: Curve and library regressions
        run: dotnet test osu.Game.Rulesets.Osu.Tests/osu.Game.Rulesets.Osu.Tests.csproj -p:RunAnalyzers=false --filter 'FullyQualifiedName~AnchorPathTest|FullyQualifiedName~PatternGalleryTest|FullyQualifiedName~DancePoseSliderGeneratorTest|FullyQualifiedName~DifficultyTimelineSampleBuilderTest|FullyQualifiedName~TimelineFinalAttributesMatchOfficialCalculation' --logger 'trx;LogFileName=editor.trx'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
  companion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/pose-slider-companion/tests -v
